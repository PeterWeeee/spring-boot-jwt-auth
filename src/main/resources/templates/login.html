<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <title>Login & Register - JWT Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px">
    <!-- Form Đăng nhập (Slide 32) -->
    <div id="loginCard" class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h3 class="mb-4 text-center text-primary font-weight-bold">Đăng nhập (Login)</h3>
            <form id="loginForm" onsubmit="return false;">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" id="email" required="required" placeholder="trungnh@hcmute.edu.vn">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" id="password" required="required" autocomplete="on" placeholder="123456">
                </div>
                <button id="login" type="button" class="btn btn-primary w-100 py-2">Login</button>
            </form>
            <div class="text-center mt-3">
                <span class="text-muted">Chưa có tài khoản?</span>
                <a href="javascript:void(0)" id="showRegister" class="text-decoration-none">Đăng ký ngay</a>
            </div>
            <div class="alert alert-info mt-3 py-2 px-3 small">
                <strong>Tài khoản mẫu:</strong><br>
                Email: <code>trungnh@hcmute.edu.vn</code> | Pass: <code>123456</code><br>
                Email: <code>admin@example.com</code> | Pass: <code>123456</code>
            </div>
        </div>
    </div>

    <!-- Form Đăng ký -->
    <div id="registerCard" class="card shadow-sm border-0 d-none">
        <div class="card-body p-4">
            <h3 class="mb-4 text-center text-success font-weight-bold">Đăng ký (Register)</h3>
            <form id="registerForm" onsubmit="return false;">
                <div class="mb-3">
                    <label for="regFullName" class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" id="regFullName" required="required" placeholder="Nguyễn Văn A">
                </div>
                <div class="mb-3">
                    <label for="regEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="regEmail" required="required" placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label for="regPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="regPassword" required="required" placeholder="123456">
                </div>
                <button id="register" type="button" class="btn btn-success w-100 py-2">Đăng ký tài khoản</button>
            </form>
            <div class="text-center mt-3">
                <span class="text-muted">Đã có tài khoản?</span>
                <a href="javascript:void(0)" id="showLogin" class="text-decoration-none">Đăng nhập</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+014" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
